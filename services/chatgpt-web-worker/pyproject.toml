[project]
name = "chatgpt-web-worker"
version = "0.1.0"
description = "Private single-account ChatGPT webpage image protocol executor"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
dependencies = [
  "curl-cffi==0.15.0",
  "fastapi==0.136.0",
  "pillow==12.2.0",
  "uvicorn==0.44.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = false
