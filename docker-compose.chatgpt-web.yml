# Optional overlay; only apply after building this checkout and approving rollout.
# This file does not change the default Compose deployment.
services:
  codex2api:
    build:
      context: .
    image: codex2api:chatgpt-web-local
    environment:
      CHATGPT_WEB_ENABLED: ${CHATGPT_WEB_ENABLED:-false}
      CHATGPT_WEB_WORKER_URL: http://chatgpt-web-worker:8091
      CHATGPT_WEB_WORKER_SECRET: ${CHATGPT_WEB_WORKER_SECRET:?Set a private shared worker secret of at least 16 characters}
      CHATGPT_WEB_TIMEOUT_SECONDS: ${CHATGPT_WEB_TIMEOUT_SECONDS:-180}
    networks:
      - codex2api-net
      - chatgpt-web-net

  chatgpt-web-worker:
    build:
      context: ./services/chatgpt-web-worker
    image: codex2api-chatgpt-web-worker:local
    environment:
      CHATGPT_WEB_WORKER_SECRET: ${CHATGPT_WEB_WORKER_SECRET:?Set a private shared worker secret of at least 16 characters}
      CHATGPT_WEB_STATE_DIR: /state
    command: ["uvicorn", "app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8091", "--no-access-log"]
    volumes:
      - chatgpt-web-state:/state
    networks:
      - chatgpt-web-net
    # No published port: only the gateway shares this dedicated network.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  chatgpt-web-net:
    driver: bridge

volumes:
  chatgpt-web-state:
